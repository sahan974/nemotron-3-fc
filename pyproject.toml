[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nemotron3-fc"
version = "0.1.0"
description = "LoRA training, evaluation, and vLLM serving for Nemotron tool calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.14,<0.15"]
bootstrap = ["kaggle>=2.2.4,<3"]
train = [
  "accelerate==1.15.0",
  "causal-conv1d==1.6.1",
  "mamba-ssm==2.3.1",
  "matplotlib>=3.9,<4",
  "numpy==2.5.3",
  "peft==0.21.0",
  "safetensors==0.8.0",
  "torch==2.10.0",
  "transformers==5.5.0",
]
serve = [
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.57.6",
  "vllm==0.18.0",
]

[project.scripts]
nemotron3-fc = "nemotron3_fc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron3_fc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
